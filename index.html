<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Love Finance</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 16px;
            padding-bottom: 80px; /* Место под кнопку */
        }
        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { margin: 0; font-size: 24px; }
        .header p { margin: 4px 0 0; color: #888; font-size: 14px; }
        
        .balance-card {
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%);
            color: white;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 8px 16px rgba(255, 107, 107, 0.3);
            margin-bottom: 24px;
        }
        .balance-card h2 { margin: 0; font-size: 14px; opacity: 0.9; text-transform: uppercase; letter-spacing: 1px; }
        .balance-card .amount { margin: 8px 0 0; font-size: 36px; font-weight: bold; }
        
        .section-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
        
        .transaction {
            background: var(--tg-theme-secondary-bg-color, #ffffff);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .transaction .category { font-weight: 500; }
        .transaction .date { font-size: 12px; color: #888; }
        .transaction .sum { font-weight: bold; }
        .transaction .sum.expense { color: #FF3B30; }

        /* Стили для кнопки добавления и модального окна */
        .fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #FF6B6B;
            color: white;
            font-size: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.4);
            cursor: pointer;
            border: none;
            z-index: 100;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }
        .modal-content {
            background: var(--tg-theme-bg-color, #ffffff);
            padding: 24px;
            border-radius: 16px;
            width: 85%;
            max-width: 320px;
        }
        .modal-content h3 { margin-top: 0; text-align: center; }
        .modal-content input, .modal-content select {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .modal-content button {
            width: 100%;
            padding: 14px;
            background: #FF6B6B;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Наши финансы 💑</h1>
        <p>Привет, <span id="user-name">гость</span>!</p>
    </div>

    <div class="balance-card">
        <h2>Потрачено за месяц</h2>
        <div class="amount" id="total-amount">0 ₽</div>
    </div>

    <div class="section-title">Последние траты</div>
    <div id="transactions-list"></div>

    <!-- Кнопка Плюс -->
    <button class="fab" onclick="openModal()">+</button>

    <!-- Окно добавления траты -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <h3>Новая трата</h3>
            <input type="number" id="input-amount" placeholder="Сумма (например, 500)" required>
            <select id="input-category">
                <option value="Еда">Еда</option>
                <option value="Транспорт">Транспорт</option>
                <option value="Развлечения">Развлечения</option>
                <option value="Жилье">Жилье</option>
                <option value="Здоровье">Здоровье</option>
                <option value="Другое">Другое</option>
            </select>
            <button onclick="addTransaction()">Записать</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-name').textContent = user.first_name;
        }

        const BASE_API_URL = "https://script.google.com/macros/s/AKfycbxKyLYO9ZI202qfb7S8Rqn0qgbQWjZCof3D_rNl4vO36a4Exg78wps8v86t-YGXz4aK/exec"; // ССЫЛКА ТУТ
        const urlParams = new URLSearchParams(window.location.search);
        const familyId = urlParams.get('family_id');
        const userId = user ? user.id : "unknown";

        async function loadData() {
            if (!familyId) return;
            try {
                const response = await fetch(BASE_API_URL + "?family_id=" + familyId);
                const data = await response.json();
                
                const list = document.getElementById('transactions-list');
                list.innerHTML = '';
                let total = 0;
                
                data.reverse().forEach(item => {
                    total += Number(item.amount);
                    let dateObj = new Date(item.date);
                    let dateStr = dateObj.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
                    
                    const div = document.createElement('div');
                    div.className = 'transaction';
                    div.innerHTML = `
                        <div>
                            <div class="category">${item.category}</div>
                            <div class="date">${dateStr}</div>
                        </div>
                        <div class="sum expense">-${item.amount} ₽</div>
                    `;
                    list.appendChild(div);
                });
                document.getElementById('total-amount').textContent = total + ' ₽';
            } catch (error) {
                console.error("Ошибка загрузки:", error);
            }
        }

        function openModal() {
            document.getElementById('modal').style.display = 'flex';
        }

        async function addTransaction() {
            const amount = document.getElementById('input-amount').value;
            const category = document.getElementById('input-category').value;

            if (!amount) {
                tg.showAlert("Пожалуйста, введите сумму");
                return;
            }

            const data = {
                family_id: familyId,
                user_id: userId,
                amount: amount,
                category: category
            };

            try {
                // Отправляем данные в Apps Script
                await fetch(BASE_API_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Важно для Google Apps Script
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: JSON.stringify(data)
                });
                
                // Закрываем окно, очищаем форму и перезагружаем список
                document.getElementById('modal').style.display = 'none';
                document.getElementById('input-amount').value = '';
                tg.showAlert("Трата успешно добавлена!");
                
                // Ждем секунду (чтобы Apps Script успел записать) и обновляем список
                setTimeout(loadData, 1000);
                
            } catch (error) {
                tg.showAlert("Ошибка при отправке");
            }
        }

        loadData();
    </script>
</body>
</html>
