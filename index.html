<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Love Finance</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 16px;
        }
        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { margin: 0; font-size: 24px; }
        .header p { margin: 4px 0 0; color: #888; font-size: 14px; }
        
        .balance-card {
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%);
            color: white;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 8px 16px rgba(255, 107, 107, 0.3);
            margin-bottom: 24px;
        }
        .balance-card h2 { margin: 0; font-size: 14px; opacity: 0.9; text-transform: uppercase; letter-spacing: 1px; }
        .balance-card .amount { margin: 8px 0 0; font-size: 36px; font-weight: bold; }
        
        .section-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
        
        .transaction {
            background: var(--tg-theme-secondary-bg-color, #ffffff);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .transaction .category { font-weight: 500; }
        .transaction .date { font-size: 12px; color: #888; }
        .transaction .sum { font-weight: bold; }
        .transaction .sum.expense { color: #FF3B30; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Наши финансы 💑</h1>
        <p>Привет, <span id="user-name">гость</span>!</p>
    </div>

    <div class="balance-card">
        <h2>Потрачено за месяц</h2>
        <div class="amount" id="total-amount">0 ₽</div>
    </div>

    <div class="section-title">Последние траты</div>
    
    <!-- Сюда будут загружаться данные -->
    <div id="transactions-list"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-name').textContent = user.first_name;
        }

        // ⚠️ ВСТАВЬ СЮДА ССЫЛКУ ИЗ GOOGLE APPS SCRIPT (между кавычками)
        const API_URL = "https://script.google.com/macros/s/AKfycbxKyLYO9ZI202qfb7S8Rqn0qgbQWjZCof3D_rNl4vO36a4Exg78wps8v86t-YGXz4aK/exec";

        async function loadData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                const list = document.getElementById('transactions-list');
                list.innerHTML = '';
                
                let total = 0;
                
                data.reverse().forEach(item => {
                    total += Number(item.amount);
                    
                    let dateObj = new Date(item.date);
                    let dateStr = dateObj.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
                    
                    const div = document.createElement('div');
                    div.className = 'transaction';
                    div.innerHTML = `
                        <div>
                            <div class="category">${item.category}</div>
                            <div class="date">${dateStr}</div>
                        </div>
                        <div class="sum expense">-${item.amount} ₽</div>
                    `;
                    list.appendChild(div);
                });
                
                document.getElementById('total-amount').textContent = total + ' ₽';
                
            } catch (error) {
                console.error("Ошибка загрузки:", error);
                document.getElementById('transactions-list').innerHTML = '<p>Ошибка загрузки данных. Проверь ссылку API.</p>';
            }
        }

        // Запускаем загрузку
        loadData();
    </script>
</body>
</html>
